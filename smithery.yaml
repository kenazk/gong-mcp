# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml

startCommand:
  type: stdio
  configSchema:
    # JSON Schema defining the configuration options for the MCP.
    type: object
    required:
      - gongAccessKey
      - gongAccessSecret
    properties:
      gongAccessKey:
        type: string
        description: Gong API access key
      gongAccessSecret:
        type: string
        description: Gong API access secret
  commandFunction:
    # A JS function that produces the CLI command based on the given config to start the MCP on stdio.
    |-
    (config) => ({ command: "node", args: ["dist/index.js"], env: { GONG_ACCESS_KEY: config.gongAccessKey, GONG_ACCESS_SECRET: config.gongAccessSecret } })
  exampleConfig:
    gongAccessKey: your_access_key_here
    gongAccessSecret: your_access_secret_here
